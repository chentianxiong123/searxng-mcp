version: '3.8'

services:
  searxng-mcp:
    build: .
    container_name: searxng-mcp
    ports:
      - "3000:3000"
    environment:
      - SEARXNG_URL=http://192.168.31.82:8080
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
    volumes:
      - ./server.py:/app/server.py:ro
    restart: unless-stopped
